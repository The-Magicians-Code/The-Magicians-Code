# Reference only — this file belongs in the ASSETS repo, NOT here.
#
# Copy it to:
#   The-Magicians-Code.github.io/.github/workflows/notify-profile-logos.yml
#
# It pings the profile repo (repository_dispatch: logos-changed) whenever a
# logo under src/assets/logos/ is added, changed, or removed on main, so the
# profile README's logo grid regenerates almost immediately.
#
# One-time setup in the assets repo:
#   Settings → Secrets and variables → Actions → New repository secret
#     Name:  PROFILE_DISPATCH_TOKEN
#     Value: a token that can trigger workflows in the profile repo, either
#       - a fine-grained PAT scoped to The-Magicians-Code/The-Magicians-Code
#         with "Contents: Read and write", or
#       - a classic PAT with the "repo" scope.

name: Notify profile of logo changes

on:
  push:
    branches: [main]
    paths:
      - "src/assets/logos/**"

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch logos-changed to profile repo
        env:
          TOKEN: ${{ secrets.PROFILE_DISPATCH_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/The-Magicians-Code/The-Magicians-Code/dispatches \
            -d '{"event_type":"logos-changed"}'
