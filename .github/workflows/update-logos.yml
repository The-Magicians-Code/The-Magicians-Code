name: Update tech-stack logos

# Regenerates the logo grid in README.md from the logos in the assets repo
# (The-Magicians-Code.github.io). Add/remove an SVG there and this keeps the
# README in sync. Runs when the assets repo signals a change
# (repository_dispatch), on demand, or weekly as a backstop.
on:
  workflow_dispatch:
  repository_dispatch:
    types: [logos-changed]
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC (backstop)

permissions:
  contents: write

concurrency:
  group: update-logos
  cancel-in-progress: true

jobs:
  update-logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Regenerate logo grid
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_logos.py

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain README.md)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: sync tech-stack logos"
            git push
          else
            echo "README already up to date."
          fi
