<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 426" width="820" height="426" role="img" aria-labelledby="title desc">
  <title id="title">Walking Claude mascot</title>
  <desc id="desc">A pixel-style Claude mascot walks from left to center, pauses to look around, jumps in an arc to the right, lands, and loops.</desc>

  <style>
    .runner { animation: travel 6.2s linear infinite both; }
    .shadow { transform-origin: center; animation: shadow 6.2s linear infinite both; }
    .body { transform-box: fill-box; transform-origin: 53px 65px; animation: body 6.2s linear infinite both; }
    .eyes { animation: eyes 6.2s linear infinite both; }
    .leg { transform-box: fill-box; transform-origin: 50% 100%; }
    .leg-odd { animation: legOdd 6.2s linear infinite both; }
    .leg-even { animation: legEven 6.2s linear infinite both; }
    .left-hand, .right-hand { animation: hands 6.2s linear infinite both; }
    .crisp { shape-rendering: crispEdges; }

    @keyframes travel {
      0%    { transform: translate(235px, 195px); }
      3.2%  { transform: translate(261px, 195px); }
      6.5%  { transform: translate(303px, 195px); }
      9.7%  { transform: translate(333px, 195px); }
      13.7% { transform: translate(386px, 198px); }
      16%   { transform: translate(393px, 195px); }
      28%   { transform: translate(394px, 195px); }
      46%   { transform: translate(394px, 195px); }
      64.5% { transform: translate(394px, 198px); }
      67.7% { transform: translate(392px, 187px); }
      71.3% { transform: translate(416px, 139px); }
      74.2% { transform: translate(489px, 125px); }
      77.4% { transform: translate(622px, 126px); }
      80.6% { transform: translate(679px, 156px); }
      82.3% { transform: translate(684px, 192px); }
      96.5% { transform: translate(685px, 195px); }
      96.6% { transform: translate(28px, 195px); }
      100%  { transform: translate(235px, 195px); }
    }

    @keyframes shadow {
      0%    { transform: translate(288px, 281px) scaleX(.95); opacity: .13; }
      13.7% { transform: translate(444px, 281px) scaleX(1); opacity: .13; }
      64.5% { transform: translate(444px, 281px) scaleX(1); opacity: .13; }
      71.3% { transform: translate(469px, 281px) scaleX(.55); opacity: .06; }
      77.4% { transform: translate(675px, 281px) scaleX(.42); opacity: .05; }
      82.3% { transform: translate(738px, 281px) scaleX(1.02); opacity: .13; }
      96.5% { transform: translate(738px, 281px) scaleX(1); opacity: .13; }
      96.6% { transform: translate(81px, 281px) scaleX(1); opacity: .13; }
      100%  { transform: translate(288px, 281px) scaleX(.95); opacity: .13; }
    }

    @keyframes body {
      0%, 13.7% { transform: translate(0, 0) rotate(0deg); }
      18%  { transform: translate(-3px, -5px) rotate(-3deg); }
      29%  { transform: translate(3px, -5px) rotate(3deg); }
      40%  { transform: translate(0, 0) rotate(0deg); }
      58%  { transform: translate(0, 0) rotate(0deg); }
      66.8% { transform: translate(0, 8px) rotate(0deg); }
      71.3% { transform: translate(0, -4px) rotate(0deg); }
      80.6% { transform: translate(0, 4px) rotate(0deg); }
      83%  { transform: translate(0, -1px) rotate(0deg); }
      88%, 100% { transform: translate(0, 0) rotate(0deg); }
    }

    @keyframes eyes {
      0%, 14% { transform: translate(0, 0); }
      18% { transform: translate(-4px, 0); }
      29% { transform: translate(4px, 12px); }
      39% { transform: translate(0, 23px); }
      57% { transform: translate(0, 23px); }
      64% { transform: translate(0, 0); }
      71%, 100% { transform: translate(3px, 0); }
    }

    @keyframes legOdd {
      0%, 1.6% { transform: scaleY(1); }
      3.2% { transform: scaleY(.45); }
      4.8% { transform: scaleY(1); }
      6.5% { transform: scaleY(.45); }
      8.1% { transform: scaleY(1); }
      9.7% { transform: scaleY(.45); }
      11.3% { transform: scaleY(1); }
      13.7% { transform: scaleY(.45); }
      16% { transform: scaleY(1); }
      18% { transform: rotate(-8deg) scaleY(1.32); }
      29% { transform: rotate(8deg) scaleY(1.2); }
      40%, 64% { transform: rotate(0deg) scaleY(1); }
      66.8% { transform: scaleY(.55); }
      71.3% { transform: scaleY(1.18); }
      80.6% { transform: scaleY(.75); }
      83%, 100% { transform: scaleY(1); }
    }

    @keyframes legEven {
      0% { transform: scaleY(.45); }
      1.6% { transform: scaleY(1); }
      4.8% { transform: scaleY(.45); }
      6.5% { transform: scaleY(1); }
      8.1% { transform: scaleY(.45); }
      9.7% { transform: scaleY(1); }
      11.3% { transform: scaleY(.45); }
      13.7% { transform: scaleY(1); }
      18% { transform: rotate(-6deg) scaleY(1.18); }
      29% { transform: rotate(9deg) scaleY(1.35); }
      40%, 64% { transform: rotate(0deg) scaleY(1); }
      66.8% { transform: scaleY(.55); }
      71.3% { transform: scaleY(1.18); }
      80.6% { transform: scaleY(.75); }
      83%, 100% { transform: scaleY(1); }
    }

    @keyframes hands {
      0%, 64% { transform: translateY(0); }
      66.8% { transform: translateY(10px); }
      71.3% { transform: translateY(-12px); }
      80.6% { transform: translateY(7px); }
      83%, 100% { transform: translateY(0); }
    }
  </style>

  <rect width="820" height="426" fill="#f7f7f7"></rect>
  <ellipse class="shadow" cx="0" cy="0" rx="44" ry="8" fill="#171513"></ellipse>

  <g class="runner crisp">
    <g clip-path="url(#ground-clip)">
      <rect class="leg leg-odd" x="11" y="60" width="11" height="26" fill="#dd775b"></rect>
      <rect class="leg leg-even" x="32" y="60" width="11" height="26" fill="#dd775b"></rect>
      <rect class="leg leg-odd" x="64" y="60" width="11" height="26" fill="#dd775b"></rect>
      <rect class="leg leg-even" x="85" y="60" width="11" height="26" fill="#dd775b"></rect>
    </g>

    <g class="body">
      <rect x="11" y="0" width="85" height="65" fill="#dd775b"></rect>
      <rect class="left-hand" x="0" y="21" width="22" height="23" fill="#dd775b"></rect>
      <rect class="right-hand" x="85" y="21" width="22" height="23" fill="#dd775b"></rect>
      <g class="eyes">
        <rect x="21" y="11" width="11" height="11" fill="#171513"></rect>
        <rect x="75" y="11" width="11" height="11" fill="#171513"></rect>
      </g>
    </g>
  </g>

  <defs>
    <clipPath id="ground-clip">
      <rect x="-20" y="-50" width="160" height="136"></rect>
    </clipPath>
  </defs>
</svg>
